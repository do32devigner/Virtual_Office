<style>
:root{--ink:#303050;--paper:#f8f8f0;--bg:#181229}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#f3ecff;font-family:'DM Sans',system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:10px 10px 44px}
header{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
h1{font:13px/1.4 'Press Start 2P',monospace;margin:0}
.btn{font:700 13px 'DM Sans',sans-serif;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:6px 12px;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.badge:focus-visible{outline:3px solid #ffd166;outline-offset:2px}

canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:manipulation}
#wx{position:absolute;top:8px;right:8px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);padding:5px 9px;font-size:12px;font-weight:700;text-align:right;line-height:1.3;max-width:70%}
#wx small{display:block;font-weight:500;opacity:.7}
#badges{position:absolute;inset:0;pointer-events:none}
.badge{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:4px 8px;text-align:center;font-family:'DM Sans',sans-serif;line-height:1.25}
.badge b{display:block;font:8px/1.3 'Press Start 2P',monospace}
.badge i{display:block;font-size:11px;font-style:normal;opacity:.75}
.badge .st{display:inline-block;margin-top:2px;padding:1px 7px;font-size:11px;font-weight:700;color:#10231a;background:#ffc857}

@keyframes pl{50%{opacity:.55}}
#otban{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#ff6b81;color:#fff;border:3px solid var(--ink);padding:5px 10px;font:8px 'Press Start 2P',monospace;cursor:pointer;animation:pl 1s steps(2) infinite}
#bar{position:fixed;left:0;right:0;bottom:0;background:#0e0a1a;border-top:3px solid #3d2f66;padding:7px 12px;font-size:12px;color:#c9bfe6;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

#modal.open{display:flex}
.card{background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:6px 6px 0 #0e0a1a;max-width:400px;width:100%;padding:16px;max-height:90vh;overflow:auto}
.card h2{font:11px/1.6 'Press Start 2P',monospace;margin:0 0 4px}.card .sub{opacity:.7;font-size:13px;margin-bottom:10px}
dl{margin:10px 0 0;display:grid;grid-template-columns:95px 1fr;gap:6px 10px;font-size:14px}dt{opacity:.65}dd{margin:0;word-break:break-word}
@media(max-width:600px){.badge i{display:none}.badge{padding:2px 5px}.badge b{font-size:6px}#wx{font-size:10px}}
</style>

<script>
/* ================================================================
   1. KONFIGURASI (edit di sini)
   Parameter uji coba di URL: ?jam=21  ?hujan=1  ?lembur=1
================================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyD6O0GLosgz_RSYo_P6J2AhetQ2V-z_II8",
  authDomain: "virtual-office-b0ca7.firebaseapp.com",
  databaseURL: "https://virtual-office-b0ca7-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "virtual-office-b0ca7",
  storageBucket: "virtual-office-b0ca7.firebasestorage.app",
  messagingSenderId: "356736573426",
  appId: "1:356736573426:web:2d91020340e5c729ad956b",
  measurementId: "G-95TXY03QY5"
};
const NODES = {tc:'city/training_centre', ca:'city/creative_agency', apt:'city/apartment'};
const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current=temperature_2m,is_day,rain,weather_code&timezone=Asia%2FJakarta';
const WX_EVERY = 15*60*1000;         // cuaca dipanggil tiap 15 menit, bukan tiap frame
const Q = new URLSearchParams(location.search);

/* ================================================================
   2. UTILITAS GAMBAR + PROYEKSI ISOMETRIC
================================================================ */
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d'), W = 480, H = 300;
cv.width = W; cv.height = H;
let TW=14, TH=7, OX=240, OY=76;                       // parameter proyeksi aktif
const setProj = m => { if(m==='macro'){TW=14;TH=7;OX=240;OY=76;} else {TW=18;TH=9;OX=240;OY=108;} };
const P = (x,y,z=0) => [Math.round(OX+(x-y)*TW), Math.round(OY+(x+y)*TH-z)];
const hex = c => [1,3,5].map(i=>parseInt(c.substr(i,2),16));
const mix = (a,b,k) => a.map((v,i)=>Math.round(v+(b[i]-v)*k));
const shade = (c,k) => 'rgb('+mix(hex(c),[0,0,0],k).join(',')+')';
const clamp = (v,a=0,b=1) => Math.min(b,Math.max(a,v));
function poly(pts,col){ctx.fillStyle=col;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();}
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function edge(a,b,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a[0]+.5,a[1]+.5);ctx.lineTo(b[0]+.5,b[1]+.5);ctx.stroke();}
function box(x,y,z,w,d,h,c){ // balok isometric, warna tutup = c, sisi otomatis lebih gelap
  poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],shade(c,.2));
  poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)],shade(c,.35));
  poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],c);
}
const rnd = n => {n=Math.sin(n*127.1)*43758.5453;return n-Math.floor(n)};

/* ================================================================
   3. WAKTU JAKARTA (WIB) + LANGIT DINAMIS
   05.00-08.00 pagi | 08.01-16.59 siang | 17.00-18.30 senja | 18.31-04.59 malam
================================================================ */
function nowWIB(){
  const q=Q.get('jam'); if(q!==null&&q!==''&&!isNaN(+q))return ((+q)%24+24)%24;
  const d=new Date(); return (d.getUTCHours()+7)%24+d.getUTCMinutes()/60+d.getUTCSeconds()/3600;
}
const fmtWIB = d => [(d.getUTCHours()+7)%24,d.getUTCMinutes(),d.getUTCSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
const NIGHT=['#0a0e2a','#0e1540','#141c52','#1a2462','#212c72','#283682'];
const MORN=['#6fb6ee','#8fc6f2','#b0d6f5','#f3cfa8','#ffc89a','#ffd9a8'];
const DAYC=['#4aa8ec','#6cbcf2','#8ccff7','#abdffa','#c9edfd','#e4f7ff'];
const SUNS=['#3b5fb0','#8a6ab0','#e0805a','#ffa24a','#ffc060','#ffe08a'];
const SKYK=[[0,NIGHT,.62],[4.8,NIGHT,.62],[5.4,MORN,.12],[8,MORN,.08],[8.5,DAYC,0],[16.8,DAYC,0],[17.1,SUNS,.18],[18.4,SUNS,.25],[18.9,NIGHT,.62],[24,NIGHT,.62]];
function skyAt(h){
  let i=0; while(i<SKYK.length-2&&h>=SKYK[i+1][0])i++;
  const a=SKYK[i],b=SKYK[i+1],k=clamp((h-a[0])/(b[0]-a[0]));
  return {cols:a[1].map((c,j)=>'rgb('+mix(hex(c),hex(b[1][j]),k).join(',')+')'),d:a[2]+(b[2]-a[2])*k};
}

/* ================================================================
   4. CUACA (Open-Meteo) + FALLBACK OFFLINE
================================================================ */
let WX={ok:false}, raining=false, rainK=0, muted=true;
const wxLabel=c=>c==null?['☁️','--']:c===0?['☀️','Cerah']:c<=2?['🌤️','Cerah Berawan']:c===3?['☁️','Berawan']:c<=48?['🌫️','Berkabut']:c<=57?['🌦️','Gerimis']:c<=67?['🌧️','Hujan']:c<=77?['❄️','Salju']:c<=82?['🌧️','Hujan Lebat']:c<=86?['❄️','Salju']:['⛈️','Badai Petir'];
async function fetchWeather(){
  try{
    const r=await fetch(WX_URL,{cache:'no-store'}); if(!r.ok)throw new Error('http');
    const c=(await r.json()).current;
    WX={ok:true,temp:c.temperature_2m,rain:c.rain,code:c.weather_code,isDay:c.is_day};
  }catch(e){WX={ok:false};}          // gagal/offline: langit tetap pakai jam sistem, hujan dimatikan
  renderWx();
}
function renderWx(){
  raining = Q.get('hujan')==='1' || (WX.ok && (WX.rain>0 || WX.code>=51));
  const [ic,tx]=WX.ok?wxLabel(raining&&WX.code<51?61:WX.code):['📴','Offline (jam lokal)'];
  $('#wx').innerHTML='📍 Jakarta | '+(WX.ok?Math.round(WX.temp)+'°C':'--°C')+' | '+ic+' '+tx+'<small>WIB '+fmtWIB(new Date()).slice(0,5)+'</small>';
}
addEventListener('offline',()=>{WX={ok:false};renderWx();}); addEventListener('online',fetchWeather);

/* ================================================================
   5. FIREBASE (node city/training_centre, city/creative_agency, city/apartment)
   Bentuk data yang didukung per node:
   { is_overtime:true, telegram_status:"URGENT", badge:"teks opsional",
     agents:{ atlas:{status,activity,updated_at,is_overtime}, ... } }
================================================================ */
const DB={tc:null,ca:null,apt:null}, fb={ok:false,sync:null,demo:false,err:''};
function startFirebase(){
  // SDK gagal dimuat / config kosong: langsung pakai data demo
  if(typeof firebase==='undefined'||!firebaseConfig||!firebaseConfig.databaseURL){fb.err='SDK Firebase tidak termuat';startDemo();return;}
  try{
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    const db=firebase.database();
    // Status koneksi tidak bergantung pada login, jadi dipasang langsung
    db.ref('.info/connected').on('value',s=>{fb.ok=!!s.val();});
    let started=false;
    const listen=()=>{
      if(started)return; started=true;
      Object.entries(NODES).forEach(([k,p])=>db.ref(p).on('value',s=>{DB[k]=s.val();fb.sync=new Date();fb.demo=false;fb.err='';},
        e=>{fb.err=e&&e.code?e.code:'read gagal';if(!fb.sync)startDemo();}));   // mis. PERMISSION_DENIED -> data demo
    };
    // Login anonim (opsional). Jika gagal/lambat, pembacaan tetap dimulai maksimal 3 detik kemudian.
    if(firebase.auth){
      firebase.auth().signInAnonymously().catch(e=>{fb.err='auth: '+(e&&e.code||'gagal');console.warn('Login anonim gagal:',e);}).then(listen);
      setTimeout(listen,3000);
    }else listen();
    setTimeout(()=>{if(!fb.sync)startDemo();},8000);  // tidak ada respons sama sekali -> data demo
  }catch(e){fb.ok=false;fb.err=String(e&&e.message||e);startDemo();}
}
function startDemo(){ // data contoh bila config belum diisi
  fb.demo=true;fb.sync=new Date();
  DB.tc={agents:{atlas:{status:'working',activity:'Menganalisis soal CPNS TWK'},leo:{status:'working',activity:'Menyusun materi tryout'}}};
  DB.ca={agents:{luna:{status:'working',activity:'Memantau tren konten anak'},milo:{status:'working',activity:'Menulis naskah dongeng'}}};
  DB.apt={is_overtime:false};
}

/* ================================================================
   6. AGEN & ATURAN LOKASI / STATUS
================================================================ */
const BLD={
  tc :{name:'TRAINING CENTRE',label:'CPNS Prep Div.',x:1,y:1,w:5,d:5,h:34,f1:'#d9e4f5',f2:'#c4d3ec',wall:'#8fa8d6',wall2:'#6f8ac0',acc:'#4aa8ec',sign:'TRAINING CENTRE'},
  ca :{name:'CREATIVE AGENCY',label:'Children Div.',x:8,y:1,w:5,d:5,h:34,f1:'#f6dcea',f2:'#eecbdd',wall:'#f3a6c8',wall2:'#d97fa8',acc:'#ff7aa8',sign:'CREATIVE AGENCY'},
  apt:{name:'APARTEMEN PEKERJA',label:'Staff Residential / Basecamp',x:1,y:8,w:5,d:5,h:44,f1:'#efe3c8',f2:'#e2d3b0',wall:'#d9b88a',wall2:'#b8956a',acc:'#ffd166',sign:'APARTEMEN'}};
const AGENTS=[
  {id:'atlas',name:'Atlas',role:'Staff - Exam Analyst',home:'tc',desk:0,i:0,shirt:'#4aa8ec',hair:'#2b1d12',skin:'#f5cba7',x:'glasses',act:'Menganalisis soal CPNS'},
  {id:'leo',name:'Leo',role:'Team Leader - Master Tutor',home:'tc',desk:1,i:1,shirt:'#2f9e5b',hair:'#6b3a1e',skin:'#e0a97a',x:'tie',act:'Menyusun materi tutor'},
  {id:'luna',name:'Luna',role:'Staff - Trend Scout',home:'ca',desk:0,i:2,shirt:'#b197fc',hair:'#d9576b',skin:'#f5cba7',x:'pigtail',act:'Memantau tren anak'},
  {id:'milo',name:'Milo',role:'Team Leader - Storywriter',home:'ca',desk:1,i:3,shirt:'#ffa94d',hair:'#a8323e',skin:'#c98b5a',x:'beret',act:'Menulis cerita anak'}];
const urgent = v => /urgent/i.test(String(v||''));
function rawOf(a){for(const k of [a.home,'apt']){const n=DB[k];if(n){const r=(n.agents&&n.agents[a.id])||n[a.id];if(r&&typeof r==='object')return r;}}return {};}
/* Jam kerja 08.00-17.00: di kantor. Di luar itu: apartemen (rest/sleep), atau overtime jika is_overtime / URGENT. */
function stateOf(a,h){
  const raw=rawOf(a), m=h*60;
  if(m>=480&&m<=1020)return {loc:a.home,mode:'work',status:'Working at Office',raw};
  const g=['tc','ca','apt'].some(k=>DB[k]&&(DB[k].is_overtime===true||urgent(DB[k].telegram_status)||urgent(DB[k].status)))||Q.get('lembur')==='1';
  const ot=raw.is_overtime===true||urgent(raw.status)||urgent(raw.telegram_status)||(raw.is_overtime===undefined&&g);
  if(ot)return {loc:'apt',mode:'overtime',status:'Remote Working (Overtime)',raw};
  return {loc:'apt',mode:(h>=22||h<5)?'sleep':'rest',status:'Resting / Standby',raw};
}
const actOf=(a,S)=>S.raw.activity||(S.mode==='work'?a.act:S.mode==='overtime'?'Menangani tugas URGENT dari jarak jauh':S.mode==='sleep'?'Tidur':'Beristirahat di apartemen');
const fmtT = v => {if(!v)return '-';const n=Number(v),d=new Date(isNaN(n)?v:(n<1e11?n*1000:n));return isNaN(d)?String(v):fmtWIB(d)+' WIB';};

/* ================================================================
   7. AUDIO (opsional, default mati): suara hujan + bunyi klik, dibuat lewat WebAudio
================================================================ */
let AC=null, rainGain=null;
function audioInit(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const n=AC.sampleRate*2, buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=buf;s.loop=true;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;
  rainGain=AC.createGain();rainGain.gain.value=0;s.connect(f);f.connect(rainGain);rainGain.connect(AC.destination);s.start();
}
function blip(fq=660){
  if(muted||!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=fq;g.gain.value=.04;
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.06);
}
$('#mute').onclick=()=>{
  muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';$('#mute').setAttribute('aria-pressed',String(!muted));
  if(!muted){if(!AC)audioInit();if(AC.state==='suspended')AC.resume();}
  blip(880);
};

/* ================================================================
   8. KOTA (MACRO VIEW)
================================================================ */
function tree(x,y){const [px,py]=P(x,y);R(px-8,py-2,16,4,'rgba(0,0,0,.18)');R(px-2,py-12,4,12,'#7a4a24');R(px-10,py-22,20,8,'#2f8f46');R(px-8,py-30,16,10,'#2f8f46');R(px-5,py-35,10,7,'#3dbb70');}
function lamp(x,y){const [px,py]=P(x,y);R(px-1,py-24,2,24,'#555');R(px-1,py-25,7,2,'#555');R(px+4,py-23,4,3,'#ffe08a');
  lights.push({x:px+6,y:py-21,r:24,col:'255,224,138',core:[px+4,py-23,4,3]});}
function cityGround(t){
  const N=14;
  poly([P(0,N),P(N,N),P(N,N,-10),P(0,N,-10)],'#4a3a2e');
  poly([P(N,0),P(N,N),P(N,N,-10),P(N,0,-10)],'#382a20');
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){
    const road=(x===6||x===7||y===6||y===7);
    poly([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],road?'#3b3b4f':(x+y)%2?'#5cb049':'#53a542');
    if(!road){const p=P(x+rnd(x*9+y),y+rnd(x+y*7));R(p[0],p[1],1,2,'#3b8a34');}
  }
  for(let i=0;i<14;i+=2){ // marka jalan putus-putus
    poly([P(i+.3,7-.04),P(i+1.1,7-.04),P(i+1.1,7+.04),P(i+.3,7+.04)],'#ffd166');
    poly([P(7-.04,i+.3),P(7+.04,i+.3),P(7+.04,i+1.1),P(7-.04,i+1.1)],'#ffd166');}
  for(let k=0;k<5;k++)poly([P(6.2+k*.3,.2),P(6.4+k*.3,.2),P(6.4+k*.3,1.4),P(6.2+k*.3,1.4)],'rgba(255,255,255,.8)');
  // taman + kolam di pojok kanan bawah
  poly([P(10,10),P(12,10),P(12,12),P(10,12)],'#4aa8ec');
  const w=Math.floor(t/400)%2;poly([P(10.6+w*.1,10.6),P(11.2+w*.1,10.6),P(11.2+w*.1,10.7),P(10.6+w*.1,10.7)],'#bde7ff');
  box(8.6,12.2,0,1.4,.4,3,'#8a5a36');
}
function building(k,t,ST){
  const b=BLD[k], s=b.w/8;
  setProj('macro');
  roomInterior(k,b.x,b.y,s,.8,false,t,ST,b.h/.8);
  const gl='rgba(190,225,255,.26)', fx=b.x+b.w, fy=b.y+b.d;
  poly([P(b.x,fy),P(fx,fy),P(fx,fy,b.h),P(b.x,fy,b.h)],gl);        // dinding kaca depan kiri
  poly([P(fx,b.y),P(fx,fy),P(fx,fy,b.h),P(fx,b.y,b.h)],gl);        // dinding kaca depan kanan
  for(let i=0;i<=b.w;i++)edge(P(b.x+i,fy),P(b.x+i,fy,b.h),b.acc,1);
  for(let j=0;j<=b.d;j++)edge(P(fx,b.y+j),P(fx,b.y+j,b.h),b.acc,1);
  for(let z=(k==='apt'?15:b.h/2);z<b.h;z+=15){edge(P(b.x,fy,z),P(fx,fy,z),b.acc,1);edge(P(fx,b.y,z),P(fx,fy,z),b.acc,1);}

    setProj('macro');cityGround(ms);
    building('tc',ms,ST);building('ca',ms,ST);building('apt',ms,ST);
    tree(0.5,5);tree(0.5,12.5);tree(13.3,7.5);tree(9,10);tree(12.6,12.5);tree(13.3,0.4);
    [[6,6],[8,6],[6,8],[8,8]].forEach(q=>lamp(q[0],q[1]));
    R(0,0,W,H,'rgba(8,10,40,'+(dark*.62).toFixed(2)+')');
  }else{
    microDraw(ms,ST);
    const lit=view==='apt'?(h*60>1020||h*60<480||Object.values(ST).some(s=>s.mode==='overtime')):(h*60>=480&&h*60<=1020);
    R(0,0,W,H,'rgba(8,10,40,'+(lit?dark*.3:.18+dark*.5).toFixed(2)+')');
  }
  // lampu, label, hujan
  ctx.save();if(nk>0)lights.forEach(l=>drawLight(l,nk));ctx.restore();
  labels.forEach(drawLabel);
  if(rainK>.02){ctx.globalAlpha=clamp(rainK);drops.forEach(d=>{d.y+=d.v*dt;d.x-=d.v*.22*dt;if(d.y>H||d.x<0){d.y=-6;d.x=Math.random()*(W+60);}R(d.x,d.y,1,5,'#a9c4ff');});ctx.globalAlpha=1;}
  if(fade>0){R(0,0,W,H,'rgba(255,255,255,'+fade.toFixed(2)+')');fade=Math.max(0,fade-dt*4);}
  const sec=Math.floor(ms/1000);if(sec!==frame.s){frame.s=sec;updateUI(h,ST);}
  requestAnimationFrame(frame);
}

initBadges();
startFirebase();
fetchWeather();setInterval(fetchWeather,WX_EVERY);
requestAnimationFrame(frame);
</script>
